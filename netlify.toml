[build]
  command = "pnpm run build:netlify"
  publish = "artifacts/students-week/dist/public"
  functions = "netlify-functions-dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
